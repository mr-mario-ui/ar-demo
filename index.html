<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Regalplaner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
#app{position:fixed;left:0;top:0;transform-origin:0 0;transform:scale(var(--app-s,1))}
@media print {
  @page { size: A4 landscape; margin: 0; }
  html, body { background: #FFFFFF !important; overflow: visible !important; height: auto !important; }
  #app { position: static !important; transform: none !important; }
  .app-root { width: auto !important; height: auto !important; display: block !important; background: #FFFFFF !important; }
  .app-root > * { display: none !important; }
  .app-root > .ds-overlay { display: block !important; position: static !important; background: #FFFFFF !important; }
  .ds-bar { display: none !important; }
  .ds-scroll { display: block !important; overflow: visible !important; padding: 0 !important; }
  .ds-sheet { width: 297mm !important; height: 209mm !important; box-shadow: none !important; margin: 0 !important; break-after: page; page-break-after: always; }
  .ds-sheet:last-child { break-after: auto; page-break-after: auto; }
  .ds-page { transform: scale(0.998) !important; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}

body{margin:0;background:#E9EDF1;font-family:"IBM Plex Sans",system-ui,sans-serif;color:#16202A}
button{font-family:inherit;color:inherit;white-space:nowrap}
button:focus-visible{outline:2px solid #1F4E9C;outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="app-root" style="position: relative; width: var(--app-w, 100vw); height: var(--app-h, 100vh); box-sizing: border-box; display: flex; flex-direction: column; background: #E9EDF1">

  <!-- Kopfzeile -->
  <div style="height: 64px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 24px; background: #16202A; color: #F3F5F7">
    <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
      <div style="font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 21px">Regalplaner</div>
      <div style="font-size: 12px; color: #A9B6C2">Projekt [PROJEKTNAME] · Version 26.09.2026 00:51</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #A9B6C2">Reihen</span><span class="mono" style="font-size: 19px">{{tot.rows}}</span></div>
    <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #A9B6C2">Felder</span><span class="mono" style="font-size: 19px">{{tot.fields}}</span></div>
    <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #A9B6C2">Feldtypen</span><span class="mono" style="font-size: 19px">{{tot.types}}</span></div>
    <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #A9B6C2">Stellplätze</span><span class="mono" style="font-size: 19px">{{tot.places}}</span></div>
    <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #A9B6C2">Warnungen</span><span class="mono" style="font-size: 19px; color: {{tot.warnColor}}">{{tot.warns}}</span></div>
    <div style="display: flex; gap: 6px">
      <button type="button" onClick="{{openSheets}}" style="height: 38px; padding: 0 14px; border: 1px solid #4A5866; border-radius: 4px; background: transparent; color: #F3F5F7; font-weight: 600; font-size: 13px; cursor: pointer">Zeichnungsset</button>
      <button type="button" onClick="{{openSave}}" style="height: 38px; padding: 0 14px; border: 1px solid #4A5866; border-radius: 4px; background: transparent; color: #F3F5F7; font-weight: 600; font-size: 13px; cursor: pointer">Speichern</button>
      <button type="button" onClick="{{openLoad}}" style="height: 38px; padding: 0 14px; border: 1px solid #4A5866; border-radius: 4px; background: transparent; color: #F3F5F7; font-weight: 600; font-size: 13px; cursor: pointer">Laden</button>
    </div>
    <button type="button" onClick="{{toggleBom}}" aria-pressed="{{bomPressed}}" style="height: 38px; padding: 0 16px; border: 0; border-radius: 4px; background: {{bomBtnBg}}; color: #1A0E05; font-weight: 600; font-size: 13.5px; cursor: pointer">{{bomBtnLabel}}</button>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; gap: 14px; padding: 14px 18px 18px; box-sizing: border-box">

    <!-- Mitte: 3D -->
    <div data-stage="1" onContextMenu="{{noCtx}}" onPointerDown="{{p3Down}}" onPointerMove="{{p3Move}}" onPointerUp="{{p3Up}}" onPointerCancel="{{p3Up}}" onWheel="{{p3Wheel}}" onClick="{{p3Bg}}" style="flex-grow: 1; min-width: 0; position: relative; overflow: hidden; border-radius: 8px; background: linear-gradient(180deg, #FFFFFF 0%, #EEF1F4 55%, #E3E8EC 100%); cursor: {{stageCursor}}; user-select: none; touch-action: none">
      <div style="position: absolute; inset: 0; overflow: hidden; perspective: {{persp}}; z-index: 0; isolation: isolate">
      <div style="position: absolute; left: 50%; top: 60%; width: 0; height: 0; transform-style: preserve-3d; will-change: transform; transform: {{scene.tf}}">
        <sc-for list="{{scene.parts}}" as="p" hint-placeholder-count="20">
          <div onClick="{{p.pick}}" title="{{p.title}}" data-hk="{{p.hk}}" style="pointer-events: {{p.pe}}; position: absolute; left: 0; top: 0; box-sizing: border-box; width: {{p.w}}px; height: {{p.h}}px; background: {{p.bg}}; border: {{p.bd}}; box-shadow: {{p.sh}}; transform-origin: 0 0; transform: {{p.tf}}; cursor: pointer"></div>
        </sc-for>
        <div style="pointer-events: none; position: absolute; left: 0; top: 0; width: {{scene.grid.w}}px; height: {{scene.grid.h}}px; transform-origin: 0 0; transform: {{scene.grid.tf}}; background-color: #F4F6F7; background-image: linear-gradient(rgba(22,32,42,0.16) 1px, transparent 1px), linear-gradient(90deg, rgba(22,32,42,0.16) 1px, transparent 1px), linear-gradient(rgba(22,32,42,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(22,32,42,0.07) 1px, transparent 1px); background-size: {{scene.grid.major}}px {{scene.grid.major}}px, {{scene.grid.major}}px {{scene.grid.major}}px, {{scene.grid.minor}}px {{scene.grid.minor}}px, {{scene.grid.minor}}px {{scene.grid.minor}}px; background-position: {{scene.grid.off}}px {{scene.grid.off}}px"></div>
        <sc-if value="{{scene.plan.on}}" hint-placeholder-val="{{false}}">
          <div style="pointer-events: none; position: absolute; left: 0; top: 0; width: {{scene.plan.w}}px; height: {{scene.plan.h}}px; transform-origin: 50% 50%; transform: {{scene.plan.tf}}; background-image: {{scene.plan.img}}; background-size: 100% 100%; background-repeat: no-repeat; opacity: {{scene.plan.op}}; outline: 1px dashed rgba(22,32,42,0.35)"></div>
        </sc-if>
        <sc-for list="{{scene.dims}}" as="d" hint-placeholder-count="1">
          <div style="pointer-events: none; position: absolute; left: 0; top: 0; width: {{d.w}}px; height: {{d.h}}px; box-sizing: border-box; border-left: 1.5px solid {{d.col}}; border-right: 1.5px solid {{d.col}}; opacity: {{d.op}}; transform-origin: 0 0; transform: {{d.tf}}">
            <div style="position: absolute; left: 0; right: 0; top: {{d.ly}}px; height: 2px; background: {{d.col}}"></div>
            <div style="position: absolute; left: -6px; top: {{d.ly}}px; width: 12px; height: 2px; background: {{d.col}}; transform: rotate(-45deg)"></div>
            <div style="position: absolute; right: -6px; top: {{d.ly}}px; width: 12px; height: 2px; background: {{d.col}}; transform: rotate(-45deg)"></div>
            <div style="position: absolute; left: -200px; right: -200px; top: {{d.ty}}px; text-align: center; line-height: 1">
              <span style="display: inline-block; font-size: {{d.fs}}px; font-weight: 600; color: {{d.col}}; white-space: nowrap; transform: {{d.rot}}">{{d.text}}</span>
            </div>
          </div>
        </sc-for>
        <sc-for list="{{scene.labels}}" as="t" hint-placeholder-count="3">
          <div style="pointer-events: none; position: absolute; left: 0; top: 0; width: {{t.w}}px; height: {{t.h}}px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transform-origin: 0 0; transform: {{t.tf}}">
            <span style="font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: {{t.fs}}px; line-height: 1; color: {{t.color}}; opacity: 0.85">{{t.id}}</span>
            <span class="mono" style="font-size: {{t.cfs}}px; line-height: 1; color: #16202A; opacity: 0.75; white-space: nowrap">{{t.coord}}</span>
          </div>
        </sc-for>
        <sc-for list="{{scene.ptexts}}" as="pt" hint-placeholder-count="0">
          <div style="pointer-events: none; position: absolute; left: 0; top: 0; width: {{pt.w}}px; height: {{pt.h}}px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; transform-origin: 0 0; transform: {{pt.tf}}; font-size: {{pt.fs}}px; font-weight: 700; color: #16202A; line-height: 1.05; text-align: center; white-space: nowrap">
            <span>{{pt.a}}</span><span style="font-weight: 500">{{pt.b}}</span>
          </div>
        </sc-for>
        <sc-for list="{{scene.smarks}}" as="sm" hint-placeholder-count="0">
          <div style="pointer-events: none; position: absolute; left: 0; top: 0; width: {{sm.w}}px; height: {{sm.h}}px; box-sizing: border-box; background: {{sm.bg}}; border: {{sm.bd}}; border-radius: {{sm.r}}; transform-origin: 0 0; transform: {{sm.tf}}"></div>
        </sc-for>
        <sc-for list="{{scene.flabels}}" as="fl" hint-placeholder-count="0">
          <div style="pointer-events: none; position: absolute; left: 0; top: 0; width: {{fl.w}}px; height: {{fl.h}}px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transform-origin: 0 0; transform: {{fl.tf}}; font-size: {{fl.fs}}px; line-height: 1.1; color: #16202A; background: #FFFFFF; border: 1.5px solid #16202A; border-radius: 4px; white-space: nowrap; overflow: hidden">
            <span style="font-weight: 700">{{fl.a}}</span><span>{{fl.b}}</span>
          </div>
        </sc-for>
        <sc-for list="{{scene.binfo}}" as="bi" hint-placeholder-count="0">
          <div style="pointer-events: none; position: absolute; left: 0; top: 0; width: {{bi.w}}px; height: {{bi.h}}px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; transform-origin: 0 0; transform: {{bi.tf}}; font-size: {{bi.fs}}px; line-height: 1.1; color: #16202A; background: rgba(255,255,255,0.92); border: 1.5px solid {{bi.bd}}; border-radius: 3px; white-space: nowrap; overflow: hidden">
            <span style="font-weight: 700">{{bi.a}}</span><span>{{bi.b}}</span><span style="font-weight: 600">{{bi.c}}</span>
          </div>
        </sc-for>
        <sc-for list="{{scene.handles}}" as="h" hint-placeholder-count="1">
          <div onClick="{{h.pick}}" title="Feld anfügen" style="position: absolute; left: 0; top: 0; width: {{h.w}}px; height: {{h.h}}px; box-sizing: border-box; border: 2px dashed #1F4E9C; border-radius: 4px; background: rgba(31,78,156,0.08); color: #1F4E9C; display: grid; place-items: center; font-weight: 700; font-size: {{h.fs}}px; transform-origin: 0 0; transform: {{h.tf}}; cursor: pointer">+</div>
        </sc-for>
      </div>
      </div>
      <span></span>
      <sc-if value="{{isoOn}}" hint-placeholder-val="{{false}}">
        <div onPointerDown="{{stop}}" onClick="{{stop}}" style="position: absolute; left: 12px; top: 56px; width: 300px; box-sizing: border-box; z-index: 21; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #45787E; color: #F3F5F7; border-radius: 6px; padding: 5px 5px 5px 10px; box-shadow: 0 4px 14px rgba(22,32,42,0.25); cursor: default">
          <span style="font-size: 12px; line-height: 1.2">Isoliert: <b>{{isoName}}</b></span>
          <button type="button" onClick="{{isoOff}}" style="height: 28px; padding: 0 10px; border: 0; border-radius: 4px; background: #F3F5F7; color: #16202A; font-weight: 600; font-size: 12px; cursor: pointer">Alle zeigen</button>
        </div>
      </sc-if>
      <sc-if value="{{measOn}}" hint-placeholder-val="{{false}}">
        <div onPointerDown="{{measDown}}" onPointerMove="{{measMove}}" onClick="{{measClick}}" title="{{measTip}}" style="position: absolute; inset: 0; z-index: 3; cursor: crosshair"></div>
      </sc-if>
      <sc-if value="{{lassoOn}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; left: {{lassoBox.x}}px; top: {{lassoBox.y}}px; width: {{lassoBox.w}}px; height: {{lassoBox.h}}px; box-sizing: border-box; border: 1.5px dashed #E11D48; background: rgba(225,29,72,0.08); pointer-events: none"></div>
      </sc-if>
      <div onPointerDown="{{stop}}" onClick="{{stop}}" style="position: absolute; right: 12px; top: 12px; z-index: 5; display: flex; gap: 4px; cursor: default">
        <button type="button" onClick="{{undoFn}}" disabled="{{undoOff}}" title="Letzte Änderung zurücknehmen (bis zu 3 Schritte)" style="height: 32px; padding: 0 10px; border: 1px solid #CBD3DA; border-radius: 5px; background: #FFFFFF; color: #16202A; cursor: pointer; font-size: 12.5px; font-weight: 600; opacity: {{undoOp}}">↶ Zurück ({{undoN}})</button>
        <button type="button" onClick="{{togglePalShow}}" aria-pressed="{{palShowPressed}}" title="Paletten in der Zeichnung ein-/ausblenden (Zuordnung bleibt erhalten)" style="height: 32px; padding: 0 10px; border: 1px solid #8E6A3F; border-radius: 5px; background: {{palShowBg}}; color: {{palShowFg}}; cursor: pointer; font-size: 12.5px; font-weight: 600">{{palShowLabel}}</button>
        <button type="button" onClick="{{toggleMeasure}}" aria-pressed="{{measPressed}}" title="Bemaßen: zwei Punkte anklicken – Maß läuft immer achsparallel in der Ebene (Boden bzw. Vorderansicht)" style="height: 32px; padding: 0 12px; border: 1px solid #7C3AED; border-radius: 5px; background: {{measBg}}; color: {{measFg}}; cursor: pointer; font-size: 12.5px; font-weight: 600">Bemaßen</button>
        <sc-if value="{{measOn}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; gap: 4px; align-items: center">
            <span style="font-size: 11.5px; color: #4A5866; background: #FFFFFF; padding: 4px 6px; border-radius: 4px; white-space: nowrap">{{measHint}}</span>
            <button type="button" onClick="{{udimUndo}}" disabled="{{udimNone}}" style="height: 30px; padding: 0 9px; border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; cursor: pointer; font-size: 12px">Letztes Maß löschen</button>
            <button type="button" onClick="{{udimClear}}" disabled="{{udimNone}}" style="height: 30px; padding: 0 9px; border: 1px solid #E5B4AA; border-radius: 4px; background: #FFFFFF; color: #8E1F12; cursor: pointer; font-size: 12px">Alle</button>
          </div>
        </sc-if>
        <button type="button" onClick="{{toggleLasso}}" aria-pressed="{{lassoPressed}}" title="Lasso: Rechteck aufziehen, um mehrere Elemente zu markieren" style="height: 32px; padding: 0 12px; border: 1px solid #45787E; border-radius: 5px; background: {{lassoBg}}; color: {{lassoFg}}; cursor: pointer; font-size: 12.5px; font-weight: 600">Lasso</button>
        <sc-if value="{{lassoMode}}" hint-placeholder-val="{{false}}">
          <div role="group" aria-label="Lasso wählt" style="display: flex; border: 1px solid #CBD3DA; border-radius: 5px; overflow: hidden">
            <sc-for list="{{lassoKinds}}" as="lk" hint-placeholder-count="4">
              <button type="button" onClick="{{lk.pick}}" aria-pressed="{{lk.pressed}}" style="height: 30px; padding: 0 9px; border: 0; font-size: 12px; cursor: pointer; background: {{lk.bg}}; color: {{lk.fg}}">{{lk.label}}</button>
            </sc-for>
          </div>
        </sc-if>
        <div role="group" aria-label="Ansicht" style="display: flex; border: 1px solid #45787E; border-radius: 5px; overflow: hidden; margin-right: 6px; margin-left: 6px">
          <sc-for list="{{viewOpts}}" as="v" hint-placeholder-count="3">
            <button type="button" onClick="{{v.pick}}" aria-pressed="{{v.pressed}}" style="height: 30px; padding: 0 12px; border: 0; font-size: 12.5px; font-weight: 600; cursor: pointer; background: {{v.bg}}; color: {{v.fg}}">{{v.label}}</button>
          </sc-for>
        </div>
        <button type="button" onClick="{{rotL}}" aria-label="Nach links drehen" style="width: 32px; height: 32px; border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; cursor: pointer">⟲</button>
        <button type="button" onClick="{{rotR}}" aria-label="Nach rechts drehen" style="width: 32px; height: 32px; border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; cursor: pointer">⟳</button>
        <button type="button" onClick="{{fitAll}}" title="Anlage optimal in der Zeichenfläche ausrichten" style="height: 32px; padding: 0 10px; border: 1px solid #45787E; border-radius: 4px; background: #FFFFFF; cursor: pointer; font-size: 12.5px; font-weight: 600">⤢ Einpassen</button>
        <button type="button" onClick="{{reset3d}}" style="height: 32px; padding: 0 10px; border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; cursor: pointer; font-size: 12.5px">Zurücksetzen</button>
      </div>
      <sc-if value="{{bom.on}}" hint-placeholder-val="{{false}}">
        <div role="region" aria-label="Stückliste" onPointerDown="{{stop}}" onClick="{{stop}}" onWheel="{{stop}}" style="position: absolute; z-index: 20; right: 12px; top: 56px; bottom: 34px; width: 380px; box-sizing: border-box; background: #FFFFFF; border-radius: 8px; box-shadow: 0 10px 30px rgba(22,32,42,0.22); padding: 12px 14px; cursor: default; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <span style="font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #4A5866">Stückliste · live</span>
            <div style="display: flex; gap: 4px">
              <button type="button" onClick="{{bom.xlsx}}" style="height: 28px; padding: 0 10px; border: 1px solid #1F7A48; border-radius: 4px; background: #1F7A48; color: #FFFFFF; cursor: pointer; font-size: 12px; font-weight: 600" title="Stückliste als Excel-Datei (.xlsx) herunterladen">Excel-Export</button>
              <button type="button" onClick="{{bom.copy}}" style="height: 28px; padding: 0 10px; border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; cursor: pointer; font-size: 12px">{{bom.copyLabel}}</button>
              <button type="button" onClick="{{toggleBom}}" aria-label="Stückliste schließen" style="width: 28px; height: 28px; border: 0; background: transparent; cursor: pointer; font-size: 16px; color: #4A5866">×</button>
            </div>
          </div>
          <div style="font-size: 12px; color: #4A5866">{{bom.summary}}</div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
            <select data-options="{{bom.rowOpts}}" value="{{bom.rowSel.val}}" onChange="{{bom.rowSel.change}}" aria-label="Reihe" style="height: 30px; border: 1px solid #CBD3DA; border-radius: 4px; padding: 0 6px; font-size: 12.5px; background: #FFFFFF; color: #16202A; cursor: pointer"></select>
            <select data-options="{{bom.byOpts}}" value="{{bom.bySel.val}}" onChange="{{bom.bySel.change}}" aria-label="Gliederung" style="height: 30px; border: 1px solid #CBD3DA; border-radius: 4px; padding: 0 6px; font-size: 12.5px; background: #FFFFFF; color: #16202A; cursor: pointer"></select>
          </div>
          <sc-if value="{{bom.filterNote}}" hint-placeholder-val="{{false}}"><div style="font-size: 12px; font-weight: 600; color: #1F4E9C">{{bom.filterNote}}</div></sc-if>
          <div style="flex-grow: 1; min-height: 0; overflow: auto">
            <sc-for list="{{bom.groups}}" as="g" hint-placeholder-count="3">
              <div style="display: flex; flex-direction: column; margin-bottom: 10px">
                <div style="font-size: 12px; font-weight: 700; padding: 4px 0; border-bottom: 1.5px solid #16202A">{{g.title}}</div>
                <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
                  <div style="display: grid; grid-template-columns: 30px 48px 1fr; gap: 6px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid #EDF0F3; font-size: 12.5px">
                    <span class="mono" style="color: #4A5866; font-size: 11px">{{it.pos}}</span>
                    <span class="mono" style="text-align: right; font-weight: 600">{{it.qty}}×</span>
                    <span>{{it.text}}<sc-if value="{{it.sub}}" hint-placeholder-val="{{false}}"><span style="display: block; font-size: 11px; color: #4A5866">{{it.sub}}</span></sc-if></span>
                  </div>
                </sc-for>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>
      <div style="position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 5; font-size: 11.5px; color: #4A5866; pointer-events: none">Anklicken: Stütze = Stützrahmen · Boden 1× = Feld, 2× = Reihe · Traverse/Palette = Ebene · + = Feld anfügen · Strg + Klick = mehrere · ⇧ + Ziehen = Lasso · Ziehen: drehen · Rechte Maustaste: verschieben · Mausrad: zoomen</div>
        <div role="region" aria-label="Eigenschaften" onPointerDown="{{stop}}" onClick="{{stop}}" onDoubleClick="{{stop}}" onWheel="{{stop}}" style="position: absolute; z-index: 20; transform: translateZ(0); left: {{menu.x}}px; top: {{menu.y}}px; width: 300px; max-height: {{menu.maxH}}px; overflow: auto; box-sizing: border-box; background: #FFFFFF; border-radius: 8px; box-shadow: 0 10px 30px rgba(22,32,42,0.22); padding: 12px 14px 14px; cursor: default; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <span style="font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #4A5866">{{ins.kindLabel}}</span>
            <sc-if value="{{ins.any}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{closeMenu}}" aria-label="Auswahl aufheben, zur Anlage" title="Zur Anlage" style="width: 26px; height: 26px; border: 0; background: transparent; cursor: pointer; font-size: 16px; color: #4A5866">×</button></sc-if>
          </div>
        <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
          <sc-for list="{{ins.crumbs}}" as="b" hint-placeholder-count="3">
            <button type="button" onClick="{{b.pick}}" style="border: 0; border-radius: 3px; padding: 3px 7px; cursor: pointer; font-size: 12px; background: {{b.bg}}; color: {{b.fg}}">{{b.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 12px; height: 12px; border-radius: 3px; background: #E3702A"></span>
          <span style="font-weight: 600; font-size: 17px; flex-grow: 1">{{ins.title}}</span>
        </div>
        <div style="font-size: 12px; color: #4A5866">{{ins.scope}}</div>

        <sc-if value="{{ins.hasScope}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 12px; font-weight: 600; color: #4A5866">Änderung gilt für</span>
            <div style="display: flex; border: 1px solid #45787E; border-radius: 5px; overflow: hidden">
              <button type="button" onClick="{{ins.scopeOne}}" style="flex: 1; height: 32px; border: 0; font-size: 12px; cursor: pointer; background: {{ins.oneBg}}; color: {{ins.oneFg}}">Nur dieses Feld</button>
              <button type="button" onClick="{{ins.scopeAll}}" style="flex: 1; height: 32px; border: 0; font-size: 12px; cursor: pointer; background: {{ins.allBg}}; color: {{ins.allFg}}">Alle {{ins.typeN}} Felder Typ {{ins.typeId}}</button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ins.warn}}" hint-placeholder-val="{{false}}">
          <div style="font-size: 12.5px; background: #FDE7E3; color: #8E1F12; padding: 8px 10px; border-radius: 4px">{{ins.warnText}}</div>
        </sc-if>

        <!-- Anlage -->
        <sc-if value="{{ins.isPlant}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid #E3E7EB; border-radius: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Grundriss (Hallenplan)</span>
              <sc-if value="{{plan.none}}" hint-placeholder-val="{{true}}">
                <label style="position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 36px; border: 1px dashed #16202A; border-radius: 4px; cursor: pointer; font-size: 12.5px; font-weight: 600">
                  Grundriss laden (PNG oder JPG)
                  <input type="file" id="planFile" accept="image/png,image/jpeg,image/webp" onChange="{{plan.load}}" style="position: absolute; width: 1px; height: 1px; opacity: 0">
                </label>
                <span style="font-size: 11.5px; color: #4A5866">PDF- oder CAD-Pläne vorher als Bild exportieren. Danach die echte Breite des Plans eingeben.</span>
              </sc-if>
              <sc-if value="{{plan.has}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; flex-direction: column; gap: 8px">
                  <label style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px">
                    <span>Breite des Plans (Bildbreite)</span>
                    <span style="display: flex; align-items: center; gap: 4px"><input type="number" id="planWidth" step="100" min="1000" value="{{plan.width}}" onChange="{{plan.setWidth}}" class="mono" style="width: 84px; height: 28px; border: 1px solid #CBD3DA; border-radius: 3px; text-align: right; padding: 0 6px; font-size: 12.5px"><span style="color: #4A5866">mm</span></span>
                  </label>
                  <div style="font-size: 11.5px; color: #4A5866">ergibt Höhe <span class="mono">{{plan.heightTxt}}</span> · Maßstab 1 Pixel = <span class="mono">{{plan.mmPerPx}}</span> mm</div>
                  <div style="display: flex; align-items: center; gap: 10px">
                    <div style="display: grid; grid-template-columns: repeat(3, 28px); grid-template-rows: repeat(3, 28px); gap: 3px">
                      <span></span><button type="button" onClick="{{plan.up}}" aria-label="Plan nach hinten" style="border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; cursor: pointer">↑</button><span></span>
                      <button type="button" onClick="{{plan.left}}" aria-label="Plan nach links" style="border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; cursor: pointer">←</button>
                      <button type="button" onClick="{{plan.center}}" aria-label="Plan zentrieren" title="Plan zentrieren" style="border: 1px solid #CBD3DA; border-radius: 4px; background: #EEF1F4; cursor: pointer; font-size: 11px">0</button>
                      <button type="button" onClick="{{plan.right}}" aria-label="Plan nach rechts" style="border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; cursor: pointer">→</button>
                      <span></span><button type="button" onClick="{{plan.down}}" aria-label="Plan nach vorne" style="border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; cursor: pointer">↓</button><span></span>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
                      <select id="planRot" value="{{plan.rot}}" onChange="{{plan.setRot}}" aria-label="Drehung des Plans" style="height: 28px; border: 1px solid #CBD3DA; border-radius: 4px; font-size: 12px"><option value="0">Drehung 0°</option><option value="90">Drehung 90°</option><option value="180">Drehung 180°</option><option value="270">Drehung 270°</option></select>
                      <select id="planOp" value="{{plan.opVal}}" onChange="{{plan.setOp}}" aria-label="Deckkraft des Plans" style="height: 28px; border: 1px solid #CBD3DA; border-radius: 4px; font-size: 12px"><option value="1">Deckkraft 100 %</option><option value="0.7">Deckkraft 70 %</option><option value="0.5">Deckkraft 50 %</option><option value="0.3">Deckkraft 30 %</option></select>
                    </div>
                  </div>
                  <span style="font-size: 11px; color: #4A5866">Pfeile verschieben den Plan um 500 mm.</span>
                  <button type="button" onClick="{{plan.remove}}" style="height: 30px; border: 1px solid #E5B4AA; border-radius: 4px; background: #FFFFFF; color: #8E1F12; cursor: pointer; font-size: 12px">Grundriss entfernen</button>
                </div>
              </sc-if>
              <sc-if value="{{plan.hasErr}}" hint-placeholder-val="{{false}}">
                <span style="font-size: 12px; color: #8E1F12">{{plan.err}}</span>
              </sc-if>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Reihen</span>
              <div style="display: flex; align-items: center; border: 1px solid #CBD3DA; border-radius: 4px">
                <button type="button" onClick="{{plantMinus}}" disabled="{{rowMinusOff}}" aria-label="Letzte Reihe entfernen" style="width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer">−</button>
                <span class="mono" style="width: 40px; text-align: center; font-size: 13px">{{rowCount}}</span>
                <button type="button" onClick="{{plantPlus}}" aria-label="Letzte Reihe duplizieren" style="width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer">+</button>
              </div>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Gassenbreite</span>
              <div style="display: flex; align-items: center; border: 1px solid #CBD3DA; border-radius: 4px">
                <button type="button" onClick="{{aisleDec}}" aria-label="Gasse schmaler" style="width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer">−</button>
                <span class="mono" style="width: 76px; text-align: center; font-size: 13px">{{aisle}} mm</span>
                <button type="button" onClick="{{aisleInc}}" aria-label="Gasse breiter" style="width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer">+</button>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Ebenenausstattung <span style="font-weight: 400">· gesamte Anlage{{plantDeckMixed}}</span></span>
              <select data-options="{{optDeck}}" id="sel_plantDeckOpts" value="{{plantDeckOpts.val}}" onChange="{{plantDeckOpts.change}}" aria-label="Ebenenausstattung" style="height: 32px; border: 1px solid #CBD3DA; border-radius: 4px; padding: 0 8px; font-size: 13px; color: #16202A; background: #FFFFFF; cursor: pointer"><option value="" disabled="{{plantDeckOpts.notMixed}}">– gemischt –</option></select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Traversenfarbe <span style="font-weight: 400">· gesamte Anlage{{plantColorMixed}}</span></span>
              <div style="display: flex; align-items: center; gap: 8px">
                <span aria-hidden="true" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 4px; background: {{plantColorOpts.hex}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18)"></span>
                <select data-options="{{optRal}}" id="ral_plantColorOpts" value="{{plantColorOpts.val}}" onChange="{{plantColorOpts.change}}" aria-label="Traversenfarbe" style="flex-grow: 1; height: 32px; border: 1px solid #CBD3DA; border-radius: 4px; padding: 0 8px; font-size: 13px; color: #16202A; background: #FFFFFF; cursor: pointer"><option value="" disabled="{{plantColorOpts.notMixed}}">– gemischt –</option></select>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Traversenprofil (Höhe) <span style="font-weight: 400">· gesamte Anlage{{plantProfMixed}}</span></span>
              <select data-options="{{optProf}}" id="sel_plantProfOpts" value="{{plantProfOpts.val}}" onChange="{{plantProfOpts.change}}" aria-label="Traversenprofil" style="height: 32px; border: 1px solid #CBD3DA; border-radius: 4px; padding: 0 8px; font-size: 13px; color: #16202A; background: #FFFFFF; cursor: pointer"><option value="" disabled="{{plantProfOpts.notMixed}}">– gemischt –</option></select>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; padding: 9px 10px; border: 1px solid #CBD3DA; border-radius: 6px; background: #F7F9FB">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Parameter &amp; Regeln (Excel)</span>
              <span style="font-size: 11.5px; color: #16202A">{{paramSrc}}</span>
              <sc-if value="{{paramHasMsgs}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: #8E1F12; background: #FDE7E3; padding: 6px 8px; border-radius: 4px">
                  <sc-for list="{{paramMsgs}}" as="pm" hint-placeholder-count="1"><span>{{pm.t}}</span></sc-for>
                </div>
              </sc-if>
              <div style="display: flex; gap: 6px">
                <label style="flex: 1; position: relative; height: 30px; display: grid; place-items: center; border: 1px solid #45787E; border-radius: 4px; background: #FFFFFF; cursor: pointer; font-size: 12px; font-weight: 600">Excel laden …
                  <input type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" onChange="{{paramFile}}" style="position: absolute; inset: 0; opacity: 0; cursor: pointer">
                </label>
                <a href="parameter.xlsx" download="parameter.xlsx" style="flex: 1; height: 30px; display: grid; place-items: center; border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; color: #16202A; font-size: 12px; text-decoration: none">Vorlage herunterladen</a>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; padding: 9px 10px; border: 1px solid #E3D6BF; border-radius: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #5A4326">Palettentypen dieser Anlage <span style="font-weight: 400">· Europalette 800 × 1200</span></span>
              <sc-for list="{{palTypeList}}" as="pt" hint-placeholder-count="1">
                <div style="display: grid; grid-template-columns: 14px 26px minmax(0, 1fr) minmax(0, 1fr) 30px 22px; gap: 5px; align-items: center">
                  <span style="width: 14px; height: 14px; border-radius: 3px; background: {{pt.color}}"></span>
                  <span style="font-weight: 700; font-size: 12px">{{pt.id}}</span>
                  <select data-options="{{optPalH}}" value="{{pt.hSel.val}}" onChange="{{pt.hSel.change}}" aria-label="Höhe inkl. Palette" style="height: 28px; border: 1px solid #CBD3DA; border-radius: 4px; font-size: 12px; background: #FFFFFF; color: #16202A"></select>
                  <select data-options="{{optPalW}}" value="{{pt.wSel.val}}" onChange="{{pt.wSel.change}}" aria-label="Gewicht" style="height: 28px; border: 1px solid #CBD3DA; border-radius: 4px; font-size: 12px; background: #FFFFFF; color: #16202A"></select>
                  <span class="mono" style="font-size: 11px; color: #4A5866; text-align: right">{{pt.n}}</span>
                  <button type="button" onClick="{{pt.remove}}" aria-label="Palettentyp löschen" title="Palettentyp löschen" style="width: 22px; height: 22px; border: 0; background: transparent; color: #8E1F12; cursor: pointer; font-size: 15px">×</button>
                </div>
              </sc-for>
              <button type="button" onClick="{{palTypeAdd}}" style="height: 28px; border: 1px dashed #8E6A3F; border-radius: 4px; background: #FFFFFF; color: #5A4326; cursor: pointer; font-size: 12px">+ Palettentyp anlegen</button>
            </div>
            <div data-palblock="1" style="display: flex; flex-direction: column; gap: 6px; padding: 9px 10px; background: #F6F1E7; border-radius: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #5A4326">Palette zuordnen <span style="font-weight: 400">· gesamte Anlage {{plantPal.note}}</span></span>
              <div style="display: flex; flex-direction: column; gap: 4px">
                <sc-for list="{{plantPal.chips}}" as="pc" hint-placeholder-count="2">
                  <button type="button" onClick="{{pc.pick}}" aria-pressed="{{pc.pressed}}" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: 1px solid {{pc.bd}}; border-radius: 4px; background: {{pc.bg}}; color: {{pc.fg}}; cursor: pointer; font-size: 12px; text-align: left">
                    <span style="width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; background: {{pc.dot}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2)"></span>{{pc.label}}
                  </button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px">
              <div style="display: flex; justify-content: space-between"><span style="color: #4A5866">Paletten</span><span class="mono">{{palTot}}</span></div>
              <div style="display: flex; justify-content: space-between"><span style="color: #4A5866">Reihen inkl. Anzahl</span><span class="mono">{{tot.rows}}</span></div>
              <div style="display: flex; justify-content: space-between"><span style="color: #4A5866">Felder</span><span class="mono">{{tot.fields}}</span></div>
              <div style="display: flex; justify-content: space-between"><span style="color: #4A5866">Stellplätze</span><span class="mono">{{tot.places}}</span></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Feldtypen (automatisch)</span>
              <sc-for list="{{typeList}}" as="t" hint-placeholder-count="3">
                <button type="button" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 2px 0; cursor: pointer; text-align: left">
                  <span style="width: 22px; height: 22px; border-radius: 3px; background: {{t.color}}; color: #FFFFFF; display: grid; place-items: center; font-weight: 700; font-size: 12px">{{t.id}}</span>
                  <span class="mono" style="font-size: 11.5px; flex-grow: 1">{{t.desc}}</span>
                  <span class="mono" style="font-size: 11.5px; color: #4A5866">{{t.n}}×</span>
                </button>
              </sc-for>
            </div>
            <p style="margin: 0; font-size: 12px; color: #4A5866; line-height: 1.45">Im 3D auswählen: Boden = Feld (2× = Reihe), Traverse = Ebene, Stütze = Stützrahmen.</p>
          </div>
        </sc-if>

        <!-- Rahmen -->
        <sc-if value="{{ins.isFrame}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Rahmenhöhe (mm) · mind. {{ins.need}}</span>
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px">
                <sc-for list="{{ins.heightOpts}}" as="o" hint-placeholder-count="8">
                  <button type="button" onClick="{{o.pick}}" class="mono" style="height: 30px; border-radius: 4px; cursor: pointer; font-size: 12px; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.bd}}">{{o.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Stützenbreite (Profil)</span>
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px">
                <sc-for list="{{ins.uwOpts}}" as="o" hint-placeholder-count="4">
                  <button type="button" onClick="{{o.pick}}" class="mono" style="height: 30px; border-radius: 4px; cursor: pointer; font-size: 12px; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.bd}}">{{o.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Rahmentiefe <span style="font-weight: 400">· gilt für alle Stützrahmen der Reihe</span></span>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px">
                <sc-for list="{{ins.frameDepthOpts}}" as="o" hint-placeholder-count="2">
                  <button type="button" onClick="{{o.pick}}" class="mono" style="height: 30px; border-radius: 4px; cursor: pointer; font-size: 12px; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.bd}}">{{o.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Stützenschutz</span>
              <div style="display: flex; flex-wrap: wrap; gap: 5px">
                <sc-for list="{{ins.guardOpts}}" as="o" hint-placeholder-count="3">
                  <button type="button" onClick="{{o.pick}}" style="padding: 6px 10px; border-radius: 999px; cursor: pointer; font-size: 12px; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.bd}}">{{o.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <button type="button" onClick="{{ins.frameMin}}" style="height: 34px; border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; cursor: pointer; font-size: 12.5px">Auf Mindesthöhe setzen</button>
              <button type="button" onClick="{{ins.frameAll}}" style="height: 34px; border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; cursor: pointer; font-size: 12.5px">Auf alle Rahmen der Reihe übertragen</button>
            </div>
          </div>
        </sc-if>

        <!-- Feld -->
        <sc-if value="{{ins.isField}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 14px">
            <button type="button" onClick="{{ins.toggleFIso}}" aria-pressed="{{ins.fIsIso}}" style="height: 34px; border: 1px solid #45787E; border-radius: 5px; cursor: pointer; font-size: 12.5px; font-weight: 600; background: {{ins.fIsoBg}}; color: {{ins.fIsoFg}}">{{ins.fIsoLabel}}</button>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Feldart</span>
              <select data-options="{{optArt}}" id="fieldArt" value="{{ins.art}}" onChange="{{ins.setArt}}" aria-label="Feldart" style="height: 32px; border: 1px solid #CBD3DA; border-radius: 4px; padding: 0 8px; font-size: 13px; color: #16202A; background: #FFFFFF; cursor: pointer"></select>
              <span style="font-size: 11.5px; color: #4A5866">{{ins.artHint}}</span>
              <sc-if value="{{ins.artWarn}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; background: #FDE7E3; color: #8E1F12; padding: 8px 10px; border-radius: 4px">
                  <span>{{ins.artWarnText}}</span>
                  <button type="button" onClick="{{ins.artFix}}" style="align-self: flex-start; height: 28px; padding: 0 10px; border: 1px solid #8E1F12; border-radius: 4px; background: #FFFFFF; color: #8E1F12; cursor: pointer; font-size: 12px">Unterste Traverse anheben</button>
                </div>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Feldweite (mm)</span>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px">
                <sc-for list="{{ins.widthOpts}}" as="o" hint-placeholder-count="6">
                  <button type="button" onClick="{{o.pick}}" class="mono" style="height: 30px; border-radius: 4px; cursor: pointer; font-size: 12px; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.bd}}">{{o.label}}</button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Traversenebenen</span>
              <div style="display: flex; align-items: center; border: 1px solid #CBD3DA; border-radius: 4px">
                <button type="button" onClick="{{ins.levDec}}" aria-label="Ebene entfernen" style="width: 32px; height: 30px; border: 0; background: transparent; cursor: pointer">−</button>

              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Traversenfarbe <span style="font-weight: 400">· ganze Reihe{{ins.rowColorMixed}}</span></span>
              <div style="display: flex; align-items: center; gap: 8px">
                <span aria-hidden="true" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 4px; background: {{ins.rowColorOpts.hex}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18)"></span>
                <select data-options="{{optRal}}" id="ral_ins_rowColorOpts" value="{{ins.rowColorOpts.val}}" onChange="{{ins.rowColorOpts.change}}" aria-label="Traversenfarbe" style="flex-grow: 1; height: 32px; border: 1px solid #CBD3DA; border-radius: 4px; padding: 0 8px; font-size: 13px; color: #16202A; background: #FFFFFF; cursor: pointer"><option value="" disabled="{{ins.rowColorOpts.notMixed}}">– gemischt –</option></select>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Traversenprofil (Höhe) <span style="font-weight: 400">· ganze Reihe{{ins.rowProfMixed}}</span></span>
              <select data-options="{{optProf}}" id="sel_ins_rowProfOpts" value="{{ins.rowProfOpts.val}}" onChange="{{ins.rowProfOpts.change}}" aria-label="Traversenprofil" style="height: 32px; border: 1px solid #CBD3DA; border-radius: 4px; padding: 0 8px; font-size: 13px; color: #16202A; background: #FFFFFF; cursor: pointer"><option value="" disabled="{{ins.rowProfOpts.notMixed}}">– gemischt –</option></select>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Anzahl dieser Reihe</span>
              <div style="display: flex; align-items: center; border: 1px solid #CBD3DA; border-radius: 4px">
                <button type="button" onClick="{{ins.cDec}}" disabled="{{ins.cDecOff}}" aria-label="Anzahl verringern" style="width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer">−</button>
                <span class="mono" style="width: 40px; text-align: center; font-size: 13px">{{ins.count}}×</span>
                <button type="button" onClick="{{ins.cInc}}" aria-label="Anzahl erhöhen" style="width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer">+</button>
              </div>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between">
              <span style="font-size: 12px; font-weight: 600; color: #4A5866">Gassenbreite</span>
              <div style="display: flex; align-items: center; border: 1px solid #CBD3DA; border-radius: 4px">
                <button type="button" onClick="{{aisleDec}}" aria-label="Gasse schmaler" style="width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer">−</button>
                <span class="mono" style="width: 76px; text-align: center; font-size: 13px">{{aisle}} mm</span>
                <button type="button" onClick="{{aisleInc}}" aria-label="Gasse breiter" style="width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer">+</button>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px">
              <div style="display: flex; justify-content: space-between"><span style="color: #4A5866">Felder</span><span class="mono">{{ins.fieldsTxt}}</span></div>
              <div style="display: flex; justify-content: space-between"><span style="color: #4A5866">Länge</span><span class="mono">{{ins.len}}</span></div>
              <div style="display: flex; justify-content: space-between"><span style="color: #4A5866">Stellplätze je Exemplar</span><span class="mono">{{ins.places}}</span></div>
            </div>
            <div style="display: flex; gap: 6px">
              <button type="button" onClick="{{rowPlus}}" style="flex: 1; height: 34px; border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; cursor: pointer; font-size: 12.5px">+ Reihe duplizieren</button>
              <button type="button" onClick="{{rowMinus}}" disabled="{{rowMinusOff}}" style="flex: 1; height: 34px; border: 1px solid #E5B4AA; border-radius: 4px; background: #FFFFFF; color: #8E1F12; cursor: pointer; font-size: 12.5px">− Reihe entfernen</button>
            </div>
          </div>
        </sc-if>
      </div>
        </div>

    </div>

  </div>

  <sc-if value="{{ds.open}}" hint-placeholder-val="{{false}}">
    <div class="ds-overlay" onClick="{{ds.close}}" style="position: absolute; inset: 0; background: #2A333C; z-index: 60; display: flex; flex-direction: column">
      <div class="ds-bar" onClick="{{stop}}" style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 20px; color: #F3F5F7">
        <button type="button" onClick="{{ds.close}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 4px; background: #F3F5F7; color: #16202A; font-weight: 700; font-size: 13px; cursor: pointer">← Zurück zum Konfigurator</button>
        <span style="font-weight: 700; font-size: 16px; flex-grow: 1">Zeichnungsset · {{ds.count}} Blätter (A4 quer) <span style="font-weight: 400; font-size: 12px; color: #A9B6C2">– Klick auf den dunklen Rand schließt ebenfalls</span></span>
        <button type="button" onClick="{{ds.print}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 4px; background: #E3702A; color: #1A0E05; font-weight: 600; font-size: 13px; cursor: pointer">Als PDF drucken</button>
        <button type="button" onClick="{{ds.close}}" style="height: 36px; padding: 0 14px; border: 1px solid #6B7783; border-radius: 4px; background: transparent; color: #F3F5F7; font-weight: 600; font-size: 13px; cursor: pointer">Schließen</button>
      </div>
      <sc-if value="{{ds.hasMsg}}" hint-placeholder-val="{{false}}">
        <div onClick="{{stop}}" style="margin: 0 20px 8px; padding: 8px 12px; border-radius: 4px; background: #FFF4DE; color: #7A4A00; font-size: 12.5px">{{ds.msg}}</div>
      </sc-if>
      <div class="ds-scroll" style="flex-grow: 1; min-height: 0; overflow: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 18px">
        <sc-for list="{{ds.sheets}}" as="sh" hint-placeholder-count="2">
          <div class="ds-sheet" onClick="{{stop}}" style="width: 1011px; height: 715px; flex-shrink: 0; position: relative; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.35)">
            <div class="ds-page" style="position: absolute; left: 0; top: 0; width: 1123px; height: 794px; background: #FFFFFF; transform: scale(0.9); transform-origin: 0 0; font-family: 'IBM Plex Sans', Arial, sans-serif; color: #16202A">
              <sc-for list="{{sh.els}}" as="e" hint-placeholder-count="20">
                <div style="position: absolute; left: {{e.x}}px; top: {{e.y}}px; width: {{e.w}}; height: {{e.h}}; background: {{e.bg}}; border: {{e.bd}}; box-sizing: border-box; transform: {{e.tf}}; transform-origin: {{e.to}}; font-size: {{e.fs}}px; font-weight: {{e.fw}}; color: {{e.c}}; white-space: nowrap; line-height: 1.15">{{e.t}}</div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{io.open}}" hint-placeholder-val="{{false}}">
    <div onClick="{{io.close}}" style="position: absolute; inset: 0; background: rgba(22,32,42,0.45); display: grid; place-items: center; z-index: 50">
      <div role="dialog" aria-modal="true" aria-label="{{io.title}}" onClick="{{stop}}" style="width: 560px; max-height: 760px; overflow: auto; box-sizing: border-box; background: #FFFFFF; border-radius: 10px; box-shadow: 0 20px 50px rgba(22,32,42,0.3); padding: 20px 22px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-weight: 700; font-size: 18px">{{io.title}}</span>
          <button type="button" onClick="{{io.close}}" aria-label="Schließen" style="width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer; font-size: 18px; color: #4A5866">×</button>
        </div>

        <sc-if value="{{io.isSave}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 12px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; color: #4A5866">Name der Konfiguration
              <input type="text" id="saveName" value="{{io.name}}" onChange="{{io.setName}}" style="height: 36px; border: 1px solid #CBD3DA; border-radius: 4px; padding: 0 10px; font-size: 14px; color: #16202A; font-weight: 400">
            </label>
            <button type="button" onClick="{{io.saveFile}}" style="height: 38px; border: 0; border-radius: 4px; background: #45787E; color: #FFFFFF; font-weight: 600; font-size: 13.5px; cursor: pointer">Als Datei speichern (.json)</button>
            <button type="button" onClick="{{io.saveLocal}}" style="height: 34px; border: 1px solid #45787E; border-radius: 4px; background: #FFFFFF; color: #45787E; font-weight: 600; font-size: 12.5px; cursor: pointer">Im Browser speichern</button>
            <div style="font-size: 12px; color: #4A5866">Oder als Text sichern, z. B. in einer E-Mail oder Datei – über „Laden“ lässt er sich wieder einfügen:</div>
            <textarea id="saveJson" readOnly="{{io.yes}}" value="{{io.json}}" style="height: 150px; resize: vertical; border: 1px solid #CBD3DA; border-radius: 4px; padding: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #16202A"></textarea>
            <button type="button" onClick="{{io.copyJson}}" style="height: 34px; border: 1px solid #CBD3DA; border-radius: 4px; background: #FFFFFF; cursor: pointer; font-size: 12.5px">Text kopieren</button>
          </div>
        </sc-if>

        <sc-if value="{{io.isLoad}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 12px">
            <label style="position: relative; height: 38px; display: grid; place-items: center; border: 0; border-radius: 4px; background: #45787E; color: #FFFFFF; font-weight: 600; font-size: 13.5px; cursor: pointer">Datei öffnen (.json) …
              <input type="file" accept=".json,application/json" onChange="{{io.openFile}}" style="position: absolute; inset: 0; opacity: 0; cursor: pointer">
            </label>
            <span style="font-size: 12.5px; font-weight: 600; color: #4A5866; margin-top: 4px">Im Browser gespeichert</span>
            <sc-if value="{{io.noSaves}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 12.5px; color: #4A5866">Noch keine Konfiguration in diesem Browser gespeichert.</span>
            </sc-if>
            <sc-for list="{{io.saves}}" as="sv" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid #EDF0F3; border-radius: 6px">
                <div style="flex-grow: 1; display: flex; flex-direction: column">
                  <span style="font-weight: 600; font-size: 13.5px">{{sv.name}}</span>
                  <span class="mono" style="font-size: 11px; color: #4A5866">{{sv.info}}</span>
                </div>
                <button type="button" onClick="{{sv.load}}" style="height: 30px; padding: 0 12px; border: 0; border-radius: 4px; background: #45787E; color: #FFFFFF; cursor: pointer; font-size: 12.5px">Laden</button>
                <button type="button" onClick="{{sv.del}}" aria-label="Gespeicherte Konfiguration löschen" style="height: 30px; padding: 0 10px; border: 1px solid #E5B4AA; border-radius: 4px; background: #FFFFFF; color: #8E1F12; cursor: pointer; font-size: 12.5px">Löschen</button>
              </div>
            </sc-for>
            <span style="font-size: 12.5px; font-weight: 600; color: #4A5866; margin-top: 6px">Aus gesichertem Text laden</span>
            <textarea id="loadJson" value="{{io.paste}}" onChange="{{io.setPaste}}" placeholder="Gesicherten Konfigurationstext hier einfügen" style="height: 130px; resize: vertical; border: 1px solid #CBD3DA; border-radius: 4px; padding: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #16202A"></textarea>
            <button type="button" onClick="{{io.loadPaste}}" style="height: 36px; border: 0; border-radius: 4px; background: #45787E; color: #FFFFFF; font-weight: 600; font-size: 13px; cursor: pointer">Text laden</button>
          </div>
        </sc-if>

        <sc-if value="{{io.hasMsg}}" hint-placeholder-val="{{false}}">
          <div style="font-size: 12.5px; padding: 8px 10px; border-radius: 4px; background: {{io.msgBg}}; color: {{io.msgFg}}">{{io.msg}}</div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>

</template>
